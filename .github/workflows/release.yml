name: Release SDK

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: sdk-production
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - run: bun run release:verify
      - id: release
        run: bun packages/sdk/scripts/release-metadata.ts
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE_ARN }}
          aws-region: us-east-1
      - name: Upload immutable release
        run: >-
          aws s3 cp packages/sdk/dist/cdn/sdk.js
          s3://${{ vars.AWS_ARTIFACT_BUCKET }}/sdk/releases/${{ steps.release.outputs.version }}/sdk.js
          --content-type application/javascript
          --cache-control public,max-age=31536000,immutable
      - name: Publish and verify canary
        run: |
          aws s3 cp packages/sdk/dist/cdn/sdk.js s3://${{ vars.AWS_ARTIFACT_BUCKET }}/sdk/canary.js --content-type application/javascript --cache-control no-cache,max-age=0
          aws cloudfront create-invalidation --distribution-id ${{ vars.AWS_DISTRIBUTION_ID }} --paths /sdk/canary.js
          curl --fail --retry 12 --retry-delay 10 --retry-all-errors https://cdn.reservine.io/sdk/canary.js --output /tmp/reservine-canary.js
          cmp packages/sdk/dist/cdn/sdk.js /tmp/reservine-canary.js
      - name: Publish npm packages with trusted publishing
        run: |
          bunx npm@11.6.2 publish --access public
          if curl --silent --fail https://registry.npmjs.org/reservine-button/0.0.25 >/dev/null; then
            echo "reservine-button@0.0.25 is already published; skipping the one-time compatibility release"
          else
            bunx npm@11.6.2 publish ../reservine-button-compat --access public
          fi
        working-directory: packages/sdk
      - name: Promote compatible channel
        run: |
          aws s3 cp packages/sdk/dist/cdn/sdk.js s3://${{ vars.AWS_ARTIFACT_BUCKET }}/sdk/v${{ steps.release.outputs.major }}.js --content-type application/javascript --cache-control no-cache,max-age=300
          aws cloudfront create-invalidation --distribution-id ${{ vars.AWS_DISTRIBUTION_ID }} --paths /sdk/v${{ steps.release.outputs.major }}.js
      - name: Verify stable channel
        run: |
          curl --fail --retry 12 --retry-delay 10 --retry-all-errors https://cdn.reservine.io/sdk/v${{ steps.release.outputs.major }}.js --output /tmp/reservine-stable.js
          cmp packages/sdk/dist/cdn/sdk.js /tmp/reservine-stable.js
