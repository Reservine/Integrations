name: Roll back SDK channel

on:
  workflow_dispatch:
    inputs:
      version:
        description: Immutable version to promote, for example 1.0.0
        required: true
        type: string
      channel:
        description: Compatible major channel
        required: true
        default: v1
        type: choice
        options: [v1]

permissions:
  contents: read
  id-token: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: sdk-production
    steps:
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE_ARN }}
          aws-region: us-east-1
      - name: Promote selected immutable release
        run: >-
          aws s3 cp
          s3://${{ vars.AWS_ARTIFACT_BUCKET }}/sdk/releases/${{ inputs.version }}/sdk.js
          s3://${{ vars.AWS_ARTIFACT_BUCKET }}/sdk/${{ inputs.channel }}.js
          --copy-props metadata-directive
          --content-type application/javascript
          --cache-control no-cache,max-age=300
      - name: Purge and verify
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ vars.AWS_DISTRIBUTION_ID }} --paths /sdk/${{ inputs.channel }}.js
          curl --fail --retry 12 --retry-delay 10 --retry-all-errors https://cdn.reservine.io/sdk/${{ inputs.channel }}.js --output /tmp/reservine-rollback.js
          aws s3 cp s3://${{ vars.AWS_ARTIFACT_BUCKET }}/sdk/releases/${{ inputs.version }}/sdk.js /tmp/reservine-release.js
          cmp /tmp/reservine-release.js /tmp/reservine-rollback.js
