# yaml-language-server: $schema=https://raw.githubusercontent.com/henderson-tech/devbox-schema/main/v2/devbox.schema.json
version: 2
# Branch-isolated Linux verification for the public Reservine SDK.
project: reservine-integrations
checkouts:
  sdk:
    from: .
    sync_ignores: [".env", ".env.*", ".worktrees", "node_modules", "dist", "cdk.out"]
    provision: ['mise x bun@1.4.3 -- bun install --frozen-lockfile', 'mise x bun@1.4.3 -- bunx playwright install chromium']
apps:
  sdk:
    cmd: 'mise x bun@1.4.3 -- bun run --cwd packages/sdk dev -- --host ${BIND_HOST:-127.0.0.1} --port {port:web}'
    ports: [web]
    ready: none
scripts:
  test: {cmd: ['mise x bun@1.4.3 -- bun run release:verify && mise x bun@1.4.3 -- bun run --cwd infra check && mise x bun@1.4.3 -- bun run --cwd infra test && mise x bun@1.4.3 -- bun run --cwd infra cdk synth --quiet'], needs: stack}
