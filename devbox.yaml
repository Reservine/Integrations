# Branch-isolated Linux verification for the public Reservine SDK.
project: reservine-integrations

apps:
  sdk:
    cmd: 'mise x bun@1.3.14 -- bun run --cwd packages/sdk dev -- --host ${BIND_HOST:-127.0.0.1} --port {port:web}'
    ports: [web]
    sync: .
    sync_ignores: [".env", ".env.*", ".worktrees", "node_modules", "dist", "cdk.out"]
    provision: 'mise x bun@1.3.14 -- bun install --frozen-lockfile && mise x bun@1.3.14 -- bunx playwright install chromium'
scripts:
  test: 'mise x bun@1.3.14 -- bun run release:verify && mise x bun@1.3.14 -- bun run --cwd infra check && mise x bun@1.3.14 -- bun run --cwd infra test && mise x bun@1.3.14 -- bun run --cwd infra cdk synth --quiet'
